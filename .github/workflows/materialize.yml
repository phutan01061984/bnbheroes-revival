name: Materialize production source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize verified preservation release
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://files.catbox.moe/3smyhv.gz -o /tmp/bnbheroes-release.tar.gz
          echo "4f3e3feb36d65bcd017ce72d88786b13069e207e79f0e7ddc26fdd5bf35d28e3  /tmp/bnbheroes-release.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/bnbheroes-release.tar.gz -C .
          npm run check:all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialize recovered 2021 preservation release"
          git push
